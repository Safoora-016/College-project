<!DOCTYPE html>
<html>
<head>
    <title> JS Calculator</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        .calculator {
            background-color: rgba(58, 7, 90, 0.799);
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: rgb(158, 12, 73);
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1><i> Calculator</i></h1>

        <label><b>Enter Number 1:</b></label>
        <input type="number" id="num1">

        <label><b>Enter Number 2:</b></label>
        <input type="number" id="num2">

        <br>

        <label><b>Select Operation:<b></label>

        <select id="operator">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction (-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
            <option value="%">Modulus (%)</option>
        </select>

        <br><br>

        <button onclick="calculate()">Calculate</button>

        <h3 id="result">Result:</h3>

    </div>

    <script>

        function calculate() {

            let a = Number(document.getElementById("num1").value);

            let b = Number(document.getElementById("num2").value);

            let op = document.getElementById("operator").value;

            let result;

            if (op == "+") {
                result = a + b;
            }

            else if (op == "-") {
                result = a - b;
            }

            else if (op == "*") {
                result = a * b;
            }

            else if (op == "/") {
                result = a / b;
            }

            else if (op == "%") {
                result = a % b;
            }

            document.getElementById("result").innerHTML = "Result: " + result;

        }

    </script>

</body>
</html>
